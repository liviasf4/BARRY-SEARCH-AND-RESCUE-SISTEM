; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = beacon, socorrista
description = repositorio prof victor

[env]
platform = espressif32
board = ttgo-t-beam
framework = arduino
monitor_speed = 115200
monitor_filters = time
lib_deps = 
	jgromes/RadioLib@^7.8.0
	mikalhart/TinyGPSPlus@^1.0.3
	adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
build_flags = 
	-Wall
	-DLORA_FREQ_HZ=915000000L
	-DLORA_SF=9
	-DLORA_BW_HZ=125000L
	-DLORA_CR_DEN=5
	-DLORA_SYNC_WORD=0x12
	-DLORA_PREAMBLE=8

[env:beacon]
build_src_filter = +<beacon/>
build_flags = 
	${env.build_flags}
	-DBEACON_INTERVAL_MS=5000
	-DBEACON_JITTER_MS=400
	-DBEACON_TX_POWER_DBM=14
	-DBEACON_USE_GPS=1

[env:socorrista]
build_src_filter = +<socorrista/>
build_flags = 
	${env.build_flags}
	-DMODEL_A_DBM=-45.0
	-DMODEL_N=2.7
	-DANCHOR_RADIUS_M=8.0
