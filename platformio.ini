; Projeto: Localização de pessoas via LoRa (TTGO T-Beam T22 V0.7)
; Dois firmwares no mesmo projeto:
;   pio run -e beacon      -t upload     -> colete da pessoa (transmissor)
;   pio run -e socorrista  -t upload     -> unidade móvel do socorrista (receptor + GPS + multilateração)
; No VS Code: barra do PlatformIO > "Project Tasks" > escolha o ambiente.

[platformio]
default_envs = beacon, socorrista

[env]
platform = espressif32
board = ttgo-t-beam
framework = arduino
monitor_speed = 115200
monitor_filters = time
lib_deps =
    jgromes/RadioLib@^7.8.0
    mikalhart/TinyGPSPlus@^1.0.3
build_flags =
    -Wall
    ; ---- Rádio (deve ser IGUAL nos dois ambientes) ----
    -DLORA_FREQ_HZ=915000000L     ; Brasil: 915-928 MHz
    -DLORA_SF=9                   ; 7..12  (maior = mais alcance, mais airtime)
    -DLORA_BW_HZ=125000L
    -DLORA_CR_DEN=5               ; 4/5
    -DLORA_SYNC_WORD=0x12         ; rede privada
    -DLORA_PREAMBLE=8

[env:beacon]
build_src_filter = +<beacon/>
build_flags =
    ${env.build_flags}
    -DBEACON_INTERVAL_MS=5000     ; período padrão (alterável pela serial)
    -DBEACON_JITTER_MS=400        ; aleatoriedade p/ evitar colisões entre beacons
    -DBEACON_TX_POWER_DBM=14      ; 2..20 dBm
    -DBEACON_USE_GPS=1            ; 1 = envia posição GPS do beacon (verdade de campo p/ testes)

[env:socorrista]
build_src_filter = +<socorrista/>
build_flags =
    ${env.build_flags}
    -DMODEL_A_DBM=-45.0           ; RSSI esperado a 1 m (calibrar!)
    -DMODEL_N=2.7                 ; expoente de perda de percurso (calibrar!)
    -DANCHOR_RADIUS_M=8.0         ; raio p/ agrupar amostras numa mesma âncora virtual
